{% extends 'learning_logs/base.html' %}
{% load django_bootstrap5 %}
{% block content %}

<form action="{% url 'learning_logs:edit_entry', entry.id}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn-outline-secondary btn-sm">Save changes</button>
</form>

{% endblock content %}
