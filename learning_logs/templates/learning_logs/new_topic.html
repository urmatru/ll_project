{% extends 'learning_logs/base.html' %}
{% load django_bootstrap5 %}


{% block content %}

    <p> Добавить новую тему </p>
    
    <form action="{% url 'learning_logs:new_topic' %}" method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button name="submit" class="btn btn-outline-secondary btn-sm">Добавить</button>
    </form>
    
{% endblock content %}
